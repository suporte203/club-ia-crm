<title>Club IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Inter:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap">

<style>
:root {
  --black:     #000000;
  --surface:   #0A0A0A;
  --card:      #111111;
  --card-hi:   #181818;
  --border:    rgba(255,255,255,0.06);
  --border-hi: rgba(212,165,32,0.3);
  --gold:      #D4A520;
  --gold-hi:   #F0C040;
  --gold-dim:  rgba(212,165,32,0.1);
  --gold-mid:  rgba(212,165,32,0.2);
  --white:     #FFFFFF;
  --txt:       #F5F5F5;
  --txt-2:     rgba(255,255,255,0.45);
  --txt-3:     rgba(255,255,255,0.22);
  --hot:       #FF4D1A;
  --hot-bg:    rgba(255,77,26,0.12);
  --warm:      #E8980A;
  --warm-bg:   rgba(232,152,10,0.12);
  --cold:      #4A85C8;
  --cold-bg:   rgba(74,133,200,0.12);
  --green:     #18C964;
  --green-bg:  rgba(24,201,100,0.1);
  --pend:      #FF3B3B;
  --pend-bg:   rgba(255,59,59,0.1);
  --purple:    #A259FF;
  --purple-bg: rgba(162,89,255,0.12);
  --r:         8px;
  --r-sm:      5px;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{background:var(--black);color:var(--txt);font-family:'Inter',system-ui,sans-serif;min-height:100vh;line-height:1.5;overflow-x:hidden}
button{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit}
input{font-family:inherit;color:inherit}
::selection{background:var(--gold-mid)}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:99px}

/* ── TOPBAR ── */
.topbar{
  height:56px;display:flex;align-items:center;gap:1.5rem;
  padding:0 1.5rem;
  background:#000;
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:100;
}
.logo-img{height:34px;object-fit:contain}
.divider-v{width:1px;height:24px;background:var(--border);flex-shrink:0}
.nav{display:flex;gap:1px}
.tab{
  padding:.42rem .9rem;border-radius:var(--r-sm);
  font-size:.78rem;font-weight:500;color:var(--txt-2);
  letter-spacing:.03em;transition:all .15s;
}
.tab:hover{color:var(--txt);background:rgba(255,255,255,0.04)}
.tab.active{
  color:var(--gold);background:var(--gold-dim);
  font-weight:600;
}
.topbar-right{display:flex;align-items:center;gap:.6rem;margin-left:auto}
.search-box{
  position:relative;display:flex;align-items:center;
}
.search-box input{
  width:200px;padding:.38rem .75rem .38rem 2rem;
  background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);
  color:var(--txt);font-size:.78rem;outline:none;transition:border-color .15s;
}
.search-box input::placeholder{color:var(--txt-3)}
.search-box input:focus{border-color:rgba(212,165,32,0.4)}
.search-icon{position:absolute;left:.65rem;color:var(--txt-3);font-size:.9rem;pointer-events:none;line-height:1}
.icon-btn{
  width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);
  color:var(--txt-2);font-size:.85rem;transition:all .15s;
}
.icon-btn:hover{color:var(--gold);border-color:var(--border-hi)}

/* ── LAYOUT ── */
.shell{display:flex;height:calc(100vh - 56px)}
.aside{
  width:200px;flex-shrink:0;background:var(--surface);
  border-right:1px solid var(--border);padding:1.25rem .875rem;
  display:flex;flex-direction:column;gap:1.5rem;overflow-y:auto;
}
.page{flex:1;overflow-y:auto;padding:1.5rem 1.75rem}

/* ── SIDEBAR ── */
.f-group{display:flex;flex-direction:column;gap:.2rem}
.f-label{
  font-family:'Syne',sans-serif;font-size:.62rem;font-weight:700;
  text-transform:uppercase;letter-spacing:.12em;color:var(--txt-3);
  margin-bottom:.3rem;padding-left:.4rem;
}
.f-chip{
  display:flex;align-items:center;justify-content:space-between;
  padding:.35rem .55rem;border-radius:var(--r-sm);
  font-size:.76rem;color:var(--txt-2);cursor:pointer;transition:all .12s;
}
.f-chip:hover{background:var(--card);color:var(--txt)}
.f-chip.on{background:var(--gold-dim);color:var(--gold);font-weight:500}
.f-count{
  font-size:.67rem;padding:1px 5px;border-radius:99px;
  background:rgba(255,255,255,0.05);color:var(--txt-3);
  font-variant-numeric:tabular-nums;
}
.f-chip.on .f-count{background:var(--gold-mid);color:var(--gold)}

/* ── STATS HERO ── */
.stats-hero{
  display:grid;grid-template-columns:repeat(6,1fr);gap:.875rem;
  margin-bottom:1.5rem;
}
.stat-tile{
  background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  padding:1.1rem 1.25rem;display:flex;flex-direction:column;gap:.5rem;
  position:relative;overflow:hidden;transition:border-color .2s;
}
.stat-tile::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:var(--accent-stripe,transparent);
}
.stat-tile:hover{border-color:rgba(255,255,255,0.1)}
.stat-num{
  font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;
  letter-spacing:-.05em;line-height:1;
  font-variant-numeric:tabular-nums;
}
.stat-lbl{font-size:.7rem;color:var(--txt-2);font-weight:400;letter-spacing:.02em}
.stat-bar{height:2px;background:rgba(255,255,255,0.06);border-radius:99px;overflow:hidden;margin-top:.25rem}
.stat-bar-f{height:100%;border-radius:99px;transition:width .6s ease}
.stat-sub{font-size:.67rem;color:var(--txt-3);letter-spacing:.01em}

/* ── SECTION HEAD ── */
.s-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.s-title{font-family:'Syne',sans-serif;font-size:.95rem;font-weight:700;letter-spacing:-.01em}
.s-action{
  padding:.3rem .75rem;border-radius:var(--r-sm);
  border:1px solid var(--border);color:var(--txt-2);font-size:.72rem;
  transition:all .15s;
}
.s-action:hover{border-color:var(--gold);color:var(--gold)}

/* ── TABLE ── */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.78rem}
thead th{
  font-family:'Syne',sans-serif;font-size:.62rem;font-weight:700;
  text-transform:uppercase;letter-spacing:.1em;color:var(--txt-3);
  padding:.55rem 1rem;text-align:left;
  border-bottom:1px solid var(--border);
  cursor:pointer;user-select:none;white-space:nowrap;
  transition:color .12s;
}
thead th:hover{color:var(--txt-2)}
thead th.sorted{color:var(--gold)}
tbody tr{
  border-bottom:1px solid rgba(255,255,255,0.03);
  transition:background .1s;cursor:pointer;
}
tbody tr:hover{background:var(--card-hi)}
tbody td{padding:.65rem 1rem;vertical-align:middle}
.td-name{font-weight:500;display:flex;align-items:center;gap:.65rem}
.ava{
  width:30px;height:30px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-family:'Syne',sans-serif;font-size:.6rem;font-weight:700;
}
.td-email{color:var(--txt-2);font-size:.72rem}
.meet-bar-wrap{display:flex;align-items:center;gap:.4rem}
.meet-bar{width:44px;height:3px;background:rgba(255,255,255,0.06);border-radius:99px;overflow:hidden}
.meet-bar-f{height:100%;border-radius:99px}
.meet-pct{font-size:.67rem;color:var(--txt-3);font-variant-numeric:tabular-nums}

/* ── BADGES ── */
.bdg{display:inline-flex;align-items:center;gap:.25rem;padding:.12rem .5rem;border-radius:99px;font-size:.67rem;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.bdg-hot{background:var(--hot-bg);color:var(--hot)}
.bdg-warm{background:var(--warm-bg);color:var(--warm)}
.bdg-cold{background:var(--cold-bg);color:var(--cold)}
.bdg-gold{background:var(--gold-dim);color:var(--gold)}
.bdg-purple{background:var(--purple-bg);color:var(--purple)}
.bdg-pend{background:var(--pend-bg);color:var(--pend)}
.bdg-green{background:var(--green-bg);color:var(--green)}
.bdg-dim{background:rgba(255,255,255,0.05);color:var(--txt-3)}

/* ── BLOCO DOTS ── */
.dots{display:flex;gap:3px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%}
.dot-p{background:var(--green)}
.dot-a{background:rgba(255,59,59,0.7)}
.dot-t{background:rgba(255,255,255,0.12)}
.dot-n{background:rgba(255,255,255,0.05)}

/* ── OVERVIEW GRID ── */
.ov-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem}
.chart-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  padding:1.25rem;
}
.cc-title{
  font-family:'Syne',sans-serif;font-size:.62rem;font-weight:700;
  text-transform:uppercase;letter-spacing:.1em;color:var(--txt-3);
  margin-bottom:1rem;
}
.donut-row{display:flex;align-items:center;gap:1.25rem}
.leg{display:flex;flex-direction:column;gap:.5rem;flex:1}
.leg-item{display:flex;align-items:center;gap:.5rem;font-size:.73rem;color:var(--txt-2)}
.leg-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.leg-val{margin-left:auto;font-weight:600;color:var(--txt);font-variant-numeric:tabular-nums;font-size:.75rem}
.bar-list{display:flex;flex-direction:column;gap:.55rem}
.bar-row{display:flex;align-items:center;gap:.6rem;font-size:.72rem}
.bar-name{width:130px;color:var(--txt-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.7rem}
.bar-track{flex:1;height:4px;background:rgba(255,255,255,0.06);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:var(--gold);transition:width .6s}
.bar-v{width:28px;text-align:right;color:var(--txt-3);font-variant-numeric:tabular-nums;font-size:.68rem}
.attn-list{display:flex;flex-direction:column;gap:.3rem;max-height:180px;overflow-y:auto}
.attn-row{
  display:flex;align-items:center;gap:.6rem;padding:.38rem .5rem;
  border-radius:var(--r-sm);cursor:pointer;transition:background .1s;font-size:.76rem;
}
.attn-row:hover{background:var(--card-hi)}

/* ── PRESENCE VIEW ── */
.bloco-block{
  background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  margin-bottom:1.25rem;overflow:hidden;
}
.bloco-head{
  padding:.875rem 1.25rem;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:.875rem;
}
.bloco-tag{
  font-family:'Syne',sans-serif;font-size:.68rem;font-weight:800;
  text-transform:uppercase;letter-spacing:.12em;padding:.2rem .6rem;
  border-radius:3px;background:var(--gold);color:#000;
}
.bloco-dt{font-size:.75rem;color:var(--txt-2)}
.bloco-stats{margin-left:auto;font-size:.73rem;color:var(--txt-2)}
.bloco-stats strong{color:var(--green)}
.pres-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.pres-row{
  display:flex;align-items:center;gap:.75rem;padding:.55rem 1.25rem;
  border-bottom:1px solid rgba(255,255,255,0.03);font-size:.76rem;
  cursor:pointer;transition:background .1s;
}
.pres-row:hover{background:var(--card-hi)}
.pres-ind{
  width:18px;height:18px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:.6rem;flex-shrink:0;
}
.pi-y{background:var(--green-bg);color:var(--green)}
.pi-n{background:var(--pend-bg);color:var(--pend)}
.pi-q{background:rgba(255,255,255,0.04);color:var(--txt-3)}
.pres-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── MEETINGS ── */
.wk-row{
  display:flex;align-items:center;gap:.875rem;
  padding:.65rem 1rem;border-radius:var(--r-sm);
  border:1px solid var(--border);background:var(--card);margin-bottom:.5rem;
}
.wk-num{font-family:'Syne',sans-serif;font-weight:700;font-size:.75rem;color:var(--gold);width:120px;flex-shrink:0}
.wk-track{flex:1;height:3px;background:rgba(255,255,255,0.06);border-radius:99px;overflow:hidden}
.wk-fill{height:100%;border-radius:99px;transition:width .6s}
.wk-info{font-size:.72rem;color:var(--txt-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.wk-info strong{color:var(--green)}

/* ── MODAL ── */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);
  z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem;
  opacity:0;pointer-events:none;transition:opacity .18s;
}
.overlay.open{opacity:1;pointer-events:auto}
.modal{
  background:#111;border:1px solid rgba(255,255,255,0.09);border-radius:14px;
  width:100%;max-width:560px;max-height:90vh;overflow-y:auto;
  transform:translateY(16px);transition:transform .2s;
}
.overlay.open .modal{transform:translateY(0)}
.m-head{
  padding:1.5rem 1.5rem 1.1rem;border-bottom:1px solid var(--border);
  display:flex;align-items:flex-start;gap:1rem;
}
.m-ava{width:46px;height:46px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:1rem;font-weight:700}
.m-name{font-family:'Syne',sans-serif;font-size:1.05rem;font-weight:700;line-height:1.2}
.m-sub{font-size:.75rem;color:var(--txt-2);margin-top:.3rem;display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.m-close{margin-left:auto;padding:.38rem;border-radius:5px;color:var(--txt-2);font-size:1rem;transition:all .12s}
.m-close:hover{color:var(--txt);background:rgba(255,255,255,0.06)}
.m-body{padding:1.25rem 1.5rem;display:flex;flex-direction:column;gap:1.25rem}
.m-grid2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.m-field{display:flex;flex-direction:column;gap:.22rem}
.fl{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--txt-3)}
.fv{font-size:.8rem;color:var(--txt);word-break:break-all}
.m-sec{font-family:'Syne',sans-serif;font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--txt-3);margin-bottom:.5rem}
.temp-row{display:flex;gap:.5rem}
.t-btn{padding:.38rem .8rem;border-radius:99px;border:1.5px solid transparent;font-size:.73rem;font-weight:600;cursor:pointer;transition:all .14s}
.t-btn.hot{background:var(--hot-bg);color:var(--hot)}
.t-btn.warm{background:var(--warm-bg);color:var(--warm)}
.t-btn.cold{background:var(--cold-bg);color:var(--cold)}
.t-btn.sel.hot{border-color:var(--hot)}
.t-btn.sel.warm{border-color:var(--warm)}
.t-btn.sel.cold{border-color:var(--cold)}
.meet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:.35rem}
.m-dot{
  width:34px;height:34px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;font-size:.58rem;font-weight:600;
  cursor:pointer;transition:all .12s;border:1px solid var(--border);
  background:var(--card);color:var(--txt-3);font-variant-numeric:tabular-nums;
}
.m-dot.present{background:var(--green-bg);border-color:rgba(24,201,100,0.4);color:var(--green)}
.m-dot.absent{background:var(--pend-bg);border-color:rgba(255,59,59,0.25);color:var(--pend)}
.m-dot:hover{border-color:var(--gold);color:var(--gold)}
.notes-ta{
  width:100%;padding:.6rem .75rem;background:var(--card);border:1px solid var(--border);
  border-radius:var(--r-sm);color:var(--txt);font-family:'Inter',sans-serif;
  font-size:.78rem;resize:vertical;min-height:56px;outline:none;transition:border-color .15s;
}
.notes-ta:focus{border-color:rgba(212,165,32,0.4)}
.notes-ta::placeholder{color:var(--txt-3)}
.m-foot{padding:.875rem 1.5rem;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:.5rem}
.btn-save{
  padding:.45rem 1.1rem;border-radius:var(--r-sm);
  background:var(--gold);color:#000;font-size:.78rem;font-weight:700;
  font-family:'Syne',sans-serif;letter-spacing:.02em;transition:all .15s;
}
.btn-save:hover{background:var(--gold-hi)}
.btn-cxl{
  padding:.45rem .9rem;border-radius:var(--r-sm);
  border:1px solid var(--border);color:var(--txt-2);font-size:.78rem;transition:all .15s;
}
.btn-cxl:hover{border-color:rgba(255,255,255,0.15);color:var(--txt)}
.empty-state{text-align:center;padding:3rem;color:var(--txt-3);font-size:.82rem}

@media(max-width:1100px){.stats-hero{grid-template-columns:repeat(3,1fr)}}
@media(max-width:800px){.aside{display:none}.ov-grid{grid-template-columns:1fr}}
@media(max-width:560px){.stats-hero{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  return Array.from({length:WEEKS.length},(_,i)=>{
    const v = Math.sin(s*i*0.37+i)*10000;
    return (v-Math.floor(v)) > 0.38 ? 'present' : 'absent';
  });
}

function calcTemp(s) {
  const p = [s.pres1,s.pres2,s.pres3][s.bloco-1];
  if (s.cat === 'PENDENTE') return 'cold';
  if (s.cat === 'BLACK') return (p==='present') ? 'hot' : 'warm';
  if (s.cat === 'SÓCIO') return (p==='present') ? 'hot' : 'warm';
  return (p==='present') ? 'warm' : (p===null ? 'warm' : 'cold');
}

const F = {temp:'all',cat:'all',bloco:'all',pres:'all'};
let Q = '', TAB = 'overview', SORT = {col:'name',dir:1};

function filtered() {
  let d = [...ST];
  if (Q) d = d.filter(s=>s.name.toLowerCase().includes(Q)||s.email.toLowerCase().includes(Q)||(s.notes||'').toLowerCase().includes(Q));
  if (F.temp!=='all') d = d.filter(s=>s.temp===F.temp);
  if (F.cat!=='all') d = d.filter(s=>s.cat===F.cat);
  if (F.bloco!=='all') d = d.filter(s=>s.bloco===+F.bloco);
  if (F.pres!=='all') d = d.filter(s=>{
    const p=[s.pres1,s.pres2,s.pres3][s.bloco-1];
    if(F.pres==='present') return p==='present';
    if(F.pres==='absent') return p==='absent';
    return p==='tbd'||p===null;
  });
  d.sort((a,b)=>{
    let av=a[SORT.col]??'',bv=b[SORT.col]??'';
    if(typeof av==='string'){av=av.toLowerCase();bv=bv.toLowerCase();}
    return av<bv?-SORT.dir:av>bv?SORT.dir:0;
  });
  return d;
}

const PALETTES = [
  ['#1C2B1A','#4ADE80'],['#1A1C2B','#818CF8'],['#2B1A1A','#F87171'],
  ['#2B1F1A','#FB923C'],['#1A2B26','#34D399'],['#271A2B','#C084FC'],
  ['#2B271A','#FCD34D'],['#1A222B','#38BDF8'],['#241A2B','#F472B6'],
  ['#1A2B1E','#86EFAC']
];
function pal(name){return PALETTES[name.charCodeAt(0)%PALETTES.length]}
function ini(name){return name.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase()}

function tbdg(t){
  if(t==='hot') return '<span class="bdg bdg-hot">🔥 Quente</span>';
  if(t==='warm') return '<span class="bdg bdg-warm">🟡 Morno</span>';
  return '<span class="bdg bdg-cold">❄️ Frio</span>';
}
function cbdg(c){
  if(c==='BLACK') return '<span class="bdg bdg-purple">◆ Black</span>';
  if(c==='SÓCIO') return '<span class="bdg bdg-gold">⭐ Sócio</span>';
  if(c==='PENDENTE') return '<span class="bdg bdg-pend">⚠ Pend.</span>';
  return '';
}
function dot(p){
  if(p==='present') return '<span class="dot dot-p" title="Presente"></span>';
  if(p==='absent') return '<span class="dot dot-a" title="Faltou"></span>';
  if(p==='tbd') return '<span class="dot dot-t" title="A confirmar"></span>';
  return '<span class="dot dot-n"></span>';
}
function dots(s){return`<div class="dots">${dot(s.pres1)}${dot(s.pres2)}${dot(s.pres3)}</div>`}

function meetPct(s){return Math.round(s.meetings.filter(m=>m==='present').length/WEEKS.length*100)}
function meetColor(p){return p>60?'var(--green)':p>30?'var(--warm)':'var(--cold)'}

function openM(id){
  const s=ST.find(s=>s.id===id);
  if(!s) return;
  const [bg,fg]=pal(s.name);
  const pp=[s.pres1,s.pres2,s.pres3][s.bloco-1];
  const pBdg=pp==='present'?'<span class="bdg bdg-green">✓ Presente</span>':pp==='absent'?'<span class="bdg bdg-pend">✗ Faltou</span>':'<span class="bdg bdg-dim">A confirmar</span>';
  const mp=meetPct(s);

  document.getElementById('modal').innerHTML=`
    <div class="m-head">
      <div class="m-ava" style="background:${bg};color:${fg}">${ini(s.name)}</div>
      <div>
        <div class="m-name">${s.name}</div>
        <div class="m-sub">${cbdg(s.cat)||'<span style="color:var(--txt-3)">Aluno</span>'} ${pBdg} <span class="bdg bdg-dim">Bloco ${s.bloco}</span></div>
      </div>
      <button class="m-close" onclick="closeM()">✕</button>
    </div>
    <div class="m-body">
      <div class="m-grid2">
        <div class="m-field"><div class="fl">E-mail</div><div class="fv">${s.email||'—'}</div></div>
        <div class="m-field"><div class="fl">Telefone</div><div class="fv">${s.phone||'—'}</div></div>
        <div class="m-field"><div class="fl">Notas</div><div class="fv" style="color:var(--txt-2)">${s.notes||'—'}</div></div>
        <div class="m-field"><div class="fl">Encontros</div><div class="fv">${s.meetings.filter(m=>m==='present').length} / ${WEEKS.length} <span style="color:var(--txt-3)">(${mp}%)</span></div></div>
      </div>
      <div>
        <div class="m-sec">Temperatura</div>
        <div class="temp-row" id="tr_${id}">
          ${['hot','warm','cold'].map(t=>`<button class="t-btn ${t}${s.temp===t?' sel':''}" onclick="setTemp(${id},'${t}')">${t==='hot'?'🔥 Quente':t==='warm'?'🟡 Morno':'❄️ Frio'}</button>`).join('')}
        </div>
      </div>
      <div>
        <div class="m-sec">Presença nos Encontros Semanais — clique para alternar</div>
        <div class="meet-grid" id="mg_${id}">
          ${s.meetings.map((m,i)=>`<div class="m-dot ${m}" title="${WEEKS[i]}" onclick="toggleM(${id},${i})">${i+1}</div>`).join('')}
        </div>
      </div>
      <div>
        <div class="m-sec">Anotações</div>
        <textarea class="notes-ta" id="nt_${id}" placeholder="Observações…">${s.notes||''}</textarea>
      </div>
    </div>
    <div class="m-foot">
      <button class="btn-cxl" onclick="closeM()">Cancelar</button>
      <button class="btn-save" onclick="saveM(${id})">Salvar</button>
    </div>`;
  document.getElementById('overlay').classList.add('open');
}

function setTemp(id,t){
  const s=ST.find(s=>s.id===id);
  if(s) s.temp=t;
  document.querySelectorAll(`#tr_${id} .t-btn`).forEach(b=>b.classList.toggle('sel',b.classList.contains(t)));
}
function toggleM(id,idx){
  const s=ST.find(s=>s.id===id);
  if(!s) return;
  s.meetings[idx]=s.meetings[idx]==='present'?'absent':'present';
  const dots=document.querySelectorAll(`#mg_${id} .m-dot`);
  dots[idx].className=`m-dot ${s.meetings[idx]}`;
}
function saveM(id){
  const s=ST.find(s=>s.id===id);
  if(s) s.notes=document.getElementById(`nt_${id}`).value;
  closeM();
  render();
}
function closeM(){document.getElementById('overlay').classList.remove('open')}
function closeOnBg(e){if(e.target.id==='overlay')closeM()}

function go(tab,el){
  TAB=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  render();
}
function sf(type,val,el){
  F[type]=val;
  el.closest('.f-group').querySelectorAll('.f-chip').forEach(c=>c.classList.remove('on'));
  el.classList.add('on');
  if(TAB==='students') render();
  updateCounts();
}
function sortBy(col){
  if(SORT.col===col)SORT.dir*=-1;else{SORT.col=col;SORT.dir=1;}
  render();
}
function applyQ(){Q=document.getElementById('q').value;if(TAB==='students')render();updateCounts()}
function updateCounts(){
  const counts={hot:0,warm:0,cold:0};
  ST.forEach(s=>counts[s.temp]++);
  ['all','hot','warm','cold'].forEach(k=>{
    const el=document.getElementById('c-'+k);
    if(el) el.textContent=k==='all'?ST.length:counts[k];
  });
}
function exportCSV(){
  const d=filtered();
  const rows=[['Nome','E-mail','Telefone','Bloco','Categoria','Temperatura','Pres B1','Pres B2','Pres B3','Encontros %','Notas']];
  d.forEach(s=>rows.push([s.name,s.email,s.phone,s.bloco,s.cat,s.temp,s.pres1||'',s.pres2||'',s.pres3||'',meetPct(s)+'%',s.notes||'']));
  const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(csv);
  a.download='club-ia.csv';a.click();
}

function render(){
  const p=document.getElementById('page');
  if(TAB==='overview') p.innerHTML=renderOverview();
  else if(TAB==='students') p.innerHTML=renderStudents();
  else if(TAB==='presence') p.innerHTML=renderPresence();
  else if(TAB==='meetings') p.innerHTML=renderMeetings();
  updateCounts();
  if(TAB==='overview') drawDonut();
}

function drawDonut(){
  const c=document.getElementById('donut');
  if(!c) return;
  const ctx=c.getContext('2d');
  const hot=ST.filter(s=>s.temp==='hot').length;
  const warm=ST.filter(s=>s.temp==='warm').length;
  const cold=ST.filter(s=>s.temp==='cold').length;
  const total=hot+warm+cold;
  const segs=[{v:hot,c:'#FF4D1A'},{v:warm,c:'#E8980A'},{v:cold,c:'#4A85C8'}];
  let a=-Math.PI/2;
  ctx.clearRect(0,0,100,100);
  segs.forEach(seg=>{
    if(!seg.v) return;
    const sw=seg.v/total*Math.PI*2;
    ctx.beginPath();ctx.moveTo(50,50);ctx.arc(50,50,40,a,a+sw);ctx.closePath();
    ctx.fillStyle=seg.c;ctx.fill();a+=sw;
  });
  ctx.beginPath();ctx.arc(50,50,26,0,Math.PI*2);
  ctx.fillStyle='#111';ctx.fill();
  ctx.fillStyle='#F5F5F5';
  ctx.font='bold 14px Syne,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(total,50,50);
}

render();
</script>
